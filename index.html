<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>myTV App - Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b2070f; }
        .toggle { color: #007bff; cursor: pointer; text-align: center; display: block; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="title">Login</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="submitBtn">Login</button>
        <span class="toggle" id="toggleMode">Need an account? Sign Up</span>
    </div>

    <script type="module">
        import { supabase } from './config.js';
        let isLogin = true;

        document.getElementById('toggleMode').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? 'Login' : 'Sign Up';
            document.getElementById('submitBtn').innerText = isLogin ? 'Login' : 'Sign Up';
            document.getElementById('toggleMode').innerText = isLogin ? 'Need an account? Sign Up' : 'Have an account? Login';
        });

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            let error, data;
            if (isLogin) {
                ({ error, data } = await supabase.auth.signInWithPassword({ email, password }));
            } else {
                ({ error, data } = await supabase.auth.signUp({ email, password }));
            }

            if (error) return alert(error.message);
            
            // Route based on role
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
            if (profile.role === 'admin') window.location.href = 'admin.html';
            else if (profile.role === 'reseller') window.location.href = 'reseller.html';
            else window.location.href = 'user.html';
        });
    </script>
</body>
</html>
