<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>myTV App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #141414; color: white; margin: 0; text-align: center; }
        .header { padding: 20px; background: #000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #e50914; }
        .container { padding: 50px 20px; max-width: 800px; margin: auto; }
        .redeem-box { background: #333; padding: 30px; border-radius: 8px; margin-top: 50px; }
        input { padding: 15px; width: 60%; font-size: 16px; border: none; border-radius: 4px; outline: none;}
        button { padding: 15px 30px; font-size: 16px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        button:hover { background: #b2070f; }
        .video-placeholder { width: 100%; height: 400px; background: #000; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #777; margin-top: 20px;}
        #activeSub { display: none; }
        #noSub { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">myTV App</div>
        <button id="logoutBtn" style="padding: 10px 15px;">Logout</button>
    </div>

    <div class="container">
        <!-- Active Sub View -->
        <div id="activeSub">
            <h2>Welcome to myTV App!</h2>
            <p>Your <strong id="tierDisplay" style="color:#e50914;"></strong> subscription is active until <strong id="expiryDisplay"></strong>.</p>
            <div class="video-placeholder">
                ▶ Select a movie or channel to start watching
            </div>
        </div>

        <!-- No Sub View -->
        <div id="noSub" class="redeem-box">
            <h2>Activate Your Subscription</h2>
            <p>Enter the coupon code provided by your reseller.</p>
            <input type="text" id="couponCode" placeholder="Enter Coupon Code (e.g. ABC123XYZ)" autocomplete="off">
            <button id="redeemBtn">Redeem</button>
        </div>
    </div>

    <script type="module">
        import { supabase, checkAuth, logout } from './config.js';
        
        document.getElementById('logoutBtn').addEventListener('click', logout);

        async function init() {
            const { profile } = await checkAuth('user');
            
            const expiry = profile.subscription_expiry ? new Date(profile.subscription_expiry) : null;
            const now = new Date();

            if (expiry && expiry > now) {
                document.getElementById('activeSub').style.display = 'block';
                document.getElementById('tierDisplay').innerText = profile.subscription_tier;
                document.getElementById('expiryDisplay').innerText = expiry.toLocaleString();
            } else {
                document.getElementById('noSub').style.display = 'block';
            }
        }

        document.getElementById('redeemBtn').addEventListener('click', async () => {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();
            if(!code) return alert('Please enter a code');
            
            const { data, error } = await supabase.rpc('redeem_coupon', { p_code: code });
            
            if(error) {
                alert(error.message);
            } else {
                alert(`Success! Redeemed ${data.tier} subscription. Valid until ${new Date(data.expiry).toLocaleString()}`);
                window.location.reload();
            }
        });

        init();
    </script>
</body>
</html>
